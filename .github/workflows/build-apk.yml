name: Build Kay's Chat Forensics APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable Android APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kays-Chat-Forensics.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kays-Chat-Forensics-APK
          path: Kays-Chat-Forensics.apk
          retention-days: 90
      - name: Publish direct-download prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-beta
          name: Kay's Chat Forensics - Android beta
          prerelease: true
          make_latest: false
          files: Kays-Chat-Forensics.apk
          overwrite_files: true
